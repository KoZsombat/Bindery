# Launchpad compose project. The same image is built by GitHub Actions and
# pushed to GHCR, so a single-container Launchpad app can deploy it too.
name: learning-book-builder

services:
  builder:
    image: ${IMAGE:-learning-book-builder:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      STATIC_DIR: /app/apps/client/dist
      BASE_DOMAIN: ${BASE_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.commandcode.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1}
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-3}
      ADMIN_DAILY_LIMIT: ${ADMIN_DAILY_LIMIT:-100}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      SESSION_CACHE_MS: ${SESSION_CACHE_MS:-15000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      LLM_MOCK: ${LLM_MOCK:-}
    volumes:
      - builder-data:/data
    expose:
      - "8080"
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # These labels let `docker compose up` work behind an existing Traefik.
    # Launchpad rewrites/owns labels when it scans this project.
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.builder.rule: Host(`builder.${BASE_DOMAIN}`)
      traefik.http.routers.builder.entrypoints: web
      traefik.http.services.builder.loadbalancer.server.port: "8080"

volumes:
  builder-data:

networks:
  web:
    external: true
