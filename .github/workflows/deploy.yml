name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Configure the repository variables LAUNCHPAD_PANEL_URL and
    # LAUNCHPAD_APP_ID, plus the LAUNCHPAD_WEBHOOK_SECRET secret.
    if: ${{ vars.LAUNCHPAD_APP_ID != '' && vars.LAUNCHPAD_PANEL_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalise image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Trigger Launchpad deployment
        env:
          PANEL_URL: ${{ vars.LAUNCHPAD_PANEL_URL }}
          APP_ID: ${{ vars.LAUNCHPAD_APP_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.name }}:${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n --arg imageTag "$IMAGE_TAG" --arg commitSha "$COMMIT_SHA" \
            '{imageTag: $imageTag, commitSha: $commitSha}' > payload.json
          curl --fail-with-body -sS -X POST "${PANEL_URL%/}/api/hooks/deploy/${APP_ID}" \
            -H "Content-Type: application/json" \
            -H "X-Launchpad-Secret: ${{ secrets.LAUNCHPAD_WEBHOOK_SECRET }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            --data @payload.json
