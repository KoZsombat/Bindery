# Launchpad deploy stack. Create a "Compose project", point it at this file, and publish
# only `bindery`:
#
#   bindery   container port 8080, health path /readyz   ->  bindery.<BASE_DOMAIN>
#   tunnel    cloudflared that serves that hostname itself (deploy.md 3.1)
#
# No host ports are published: Launchpad attaches the service to its `web` network and adds
# the Traefik router, or the stack's own `tunnel` dials out to Cloudflare. `bindery-data`
# holds SQLite, uploads and generated sites.
#
# Values come from `.env.prod` (template: `.env.prod.example`); Launchpad asks for every
# `${VAR}` placeholder while scanning. `:?` marks load-bearing variables, so a missing
# secret stops the deploy instead of starting a container that cannot authenticate.
#
# `tunnel` carries no `profiles`: Launchpad ignores profiles and starts every service in
# the file, so its token is required — a missing token fails while parsing the compose file
# instead of a crash-looping connector failing the deploy. If you route through the panel's
# Traefik instead, create a tunnel with no public hostname; it registers and serves nothing.

services:
  bindery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    # Launchpad reads `expose` to suggest the container port during the scan; nothing is published.
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      STATIC_DIR: /app/apps/client/dist

      # Public hostname and generated-site domain. SITE_ORIGIN must be the exact browser
      # origin (scheme + host, no trailing slash); it becomes Better Auth's base URL.
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN, e.g. example.com}
      SITE_ORIGIN: ${SITE_ORIGIN:?set SITE_ORIGIN, e.g. https://bindery.example.com}
      BETTER_AUTH_URL: ${SITE_ORIGIN:?}

      # Secrets. Generate each with: openssl rand -base64 32
      # ENCRYPTION_KEY must stay stable or saved per-user API keys become unreadable.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a 32+ character BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a stable 32+ character ENCRYPTION_KEY}

      # First-boot administrator. Sign-up is disabled; this account creates the others.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set a 10+ character ADMIN_PASSWORD}

      # Per-user keys are entered in Settings; these are only defaults for the form.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.commandcode.ai/provider/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-32000}
      LLM_ALLOW_PRIVATE_HOSTS: ${LLM_ALLOW_PRIVATE_HOSTS:-0}

      # Quotas and worker limits. All three generation caps are also editable in Admin.
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-3}
      ADMIN_DAILY_LIMIT: ${ADMIN_DAILY_LIMIT:-100}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      SESSION_CACHE_MS: ${SESSION_CACHE_MS:-15000}
      MAX_BOOK_CHAPTERS: ${MAX_BOOK_CHAPTERS:-30}
      CHAPTER_BATCH_SIZE: ${CHAPTER_BATCH_SIZE:-2}

      # One reverse-proxy hop (Traefik/Cloudflare) in front of the container.
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      # Leave empty in production; `1` generates deterministic sample books without a key.
      LLM_MOCK: ${LLM_MOCK:-}

    volumes:
      - bindery-data:/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The stack's own Cloudflare tunnel, remotely managed: the public hostname lives in the
  # dashboard (Zero Trust -> Networks -> Tunnels -> Public hostnames) and points at
  #   bindery.<BASE_DOMAIN>  ->  http://bindery:8080
  # Add a wildcard hostname (*.sites.<BASE_DOMAIN>) -> http://bindery:8080 if generated
  # books are served on subdomains. Nothing is published for this service: cloudflared
  # opens the connection outbound.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN - the token from the tunnel's install command}
    depends_on:
      bindery:
        condition: service_started
    restart: unless-stopped

volumes:
  bindery-data:
